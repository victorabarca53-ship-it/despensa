<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despensa</title>
<meta name="description" content="Despensa, compras, cocina y hábitos para comer mejor.">
<meta name="theme-color" content="#1F5F3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face { font-family: "Sora"; font-weight: 600; font-display: swap; src: url(vendor/fonts/sora-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Sora"; font-weight: 700; font-display: swap; src: url(vendor/fonts/sora-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(vendor/fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(vendor/fonts/inter-latin-600-normal.woff2) format("woff2"); }

/* Layout: app de una columna (máx. 640 px), encabezado arriba y 5 pestañas abajo, pensada para el pulgar */
:root {
  --bg: #EEF3EE; --surface: #FFFFFF; --ink: #17231B; --muted: #56675B; --line: #D6E0D7;
  --accent: #2B7A4B; --accent-ink: #FFFFFF; --accent-soft: #DDEFE2;
  --chili: #B9441C; --chili-soft: #FBE5DC; --warn: #8A5F00; --warn-soft: #FFF0C7;
  --water: #1F6FA8; --water-soft: #DCEBF6;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1410; --surface: #172019; --ink: #E3ECE5; --muted: #98AC9E; --line: #29362D;
    --accent: #6BC28E; --accent-ink: #0E1410; --accent-soft: #1C3325;
    --chili: #F0895F; --chili-soft: #3A2117; --warn: #E9C562; --warn-soft: #3A2F12;
    --water: #7DB8E6; --water-soft: #16293A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; font-weight: 600; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.nota { font-size: 0.85rem; color: var(--muted); }
.aviso { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); }
.top h1 { font-size: 1.4rem; }
.top .sub { color: var(--muted); font-size: 0.85rem; }

.view { display: grid; gap: 16px; padding-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.barra { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.barra > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.barra.agua { background: var(--water-soft); } .barra.agua > span { background: var(--water); }
.barra.alta > span { background: var(--chili); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.btn.prim { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.chico { padding: 4px 10px; font-size: 0.85rem; border-radius: 999px; }
.btn.peligro { color: var(--chili); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
input[type=text], input[type=number], input[type=date], input[type=search], select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; min-width: 0;
}
.form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); align-items: end; }
.form label { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); }

.lista { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 0.82rem; color: var(--muted); grid-column: 1; }
.item .d { grid-column: 2; grid-row: 1 / span 2; text-align: right; }
.estado { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.estado button { border: 0; background: none; padding: 4px 9px; font-size: 0.78rem; cursor: pointer; color: var(--muted); }
.estado button[aria-pressed="true"].hay { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.estado button[aria-pressed="true"].poco { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.estado button[aria-pressed="true"].nada { background: var(--chili-soft); color: var(--chili); font-weight: 600; }
.check { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.check.hecho .t { text-decoration: line-through; opacity: .55; }

.plato h3 { font-size: 1rem; }
.tiempo { white-space: nowrap; font-size: 0.78rem; border-radius: 999px; padding: 2px 9px; background: var(--accent-soft); }
.tiempo.lento { background: var(--chili-soft); color: var(--chili); }
.meta-mini { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.82rem; color: var(--muted); }
.menu-tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.menu-tabla th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; }
.menu-tabla td { border-top: 1px solid var(--line); padding: 8px 4px; vertical-align: top; }
.tabla-wrap { overflow-x: auto; }
.grande { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; }
.grande small { font-family: var(--f-body); font-size: .85rem; color: var(--muted); font-weight: 400; }
canvas { max-width: 100%; }
.lienzo { position: relative; height: 220px; min-width: 0; }
.vacio { color: var(--muted); text-align: center; padding: 24px 0; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.tab { border: 0; background: none; cursor: pointer; display: grid; place-content: center; gap: 2px; color: var(--muted); font-size: 0.72rem; font-weight: 600; border-top: 3px solid transparent; }
.tab svg { width: 22px; height: 22px; margin: 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: .9rem; z-index: 9; }
@media (prefers-reduced-motion: reduce) { .barra > span { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1 id="titulo">Hoy</h1><div class="sub" id="subtitulo"></div></div>
    <span class="nota" id="estado-red"></span>
  </header>
  <main>
    <section class="view" id="v-hoy"></section>
    <section class="view" id="v-despensa" hidden></section>
    <section class="view" id="v-compras" hidden></section>
    <section class="view" id="v-cocina" hidden></section>
    <section class="view" id="v-progreso" hidden></section>
  </main>
</div>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in" role="tablist">
    <button class="tab" role="tab" data-vista="hoy" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button class="tab" role="tab" data-vista="despensa" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 6h4M10 12h4M10 18h4"/></svg>Despensa</button>
    <button class="tab" role="tab" data-vista="compras" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20.5 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Compras</button>
    <button class="tab" role="tab" data-vista="cocina" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h16a8 8 0 0 1-16 0Z"/><path d="M9 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg>Cocina</button>
    <button class="tab" role="tab" data-vista="progreso" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progreso</button>
  </div>
</nav>

<script src="vendor/chart.umd.min.js"></script>
<script>
"use strict";
/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clp = (n) => "$" + Math.round(n || 0).toLocaleString("es-CL");
const hoyISO = () => new Date().toLocaleDateString("sv-SE");
const fmtFecha = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long" });
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function lunesDe(iso) {
  const d = new Date(iso + "T12:00:00"); const dia = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dia);
  return d.toLocaleDateString("sv-SE");
}

/* ---------- Guardado local (IndexedDB, con respaldo en localStorage) ---------- */
const DB = {
  abrir() {
    return new Promise((ok, mal) => {
      const r = indexedDB.open("despensa", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    });
  },
  async leer() {
    try {
      const db = await this.abrir();
      return await new Promise((ok, mal) => { const q = db.transaction("kv").objectStore("kv").get("estado"); q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error); });
    } catch (e) { try { return JSON.parse(localStorage.getItem("despensa-estado") || "null"); } catch (_) { return null; } }
  },
  async guardar(estado) {
    try {
      const db = await this.abrir();
      await new Promise((ok, mal) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(estado, "estado"); t.oncomplete = ok; t.onerror = () => mal(t.error); });
    } catch (e) { try { localStorage.setItem("despensa-estado", JSON.stringify(estado)); } catch (_) { toast("No se pudo guardar en este navegador"); } }
  },
};

let E = null;            // estado completo de la app
const ui = { tiempo: 0, texto: "", soloDisponibles: true, mes: null };
const guardar = () => DB.guardar(E);

function estadoVacio() {
  return { semilla: null, perfil: {}, compras: [], ideas: {}, precios: {}, stock: {}, lista: [], menu: {}, registros: {}, creado: hoyISO() };
}

/* El archivo de datos trae compras, ideas y precios armados por Claude. Se agregan compras nuevas sin borrar lo registrado.
   Devuelve cuántas compras nuevas entraron (null si esa versión ya estaba cargada). */
async function aplicarDatos(s) {
  if (E.semilla === s.version) return null;
  E.perfil = { ...s.perfil, ...(E.perfil.propio || {}), propio: E.perfil.propio };
  E.ideas = s.ideas; E.precios = s.precios; E.claves = s.claves || [];
  const ids = new Set(E.compras.map((c) => c.id));
  const nuevas = s.compras.filter((c) => !ids.has(c.id));
  nuevas.forEach((c) => {
    E.compras.push(c);
    c.items.forEach((it) => { if (!E.stock[it.id]) E.stock[it.id] = "hay"; });
    (c.pendientes || []).forEach((p) => E.lista.push({ id: uid(), nombre: p, hecho: false, origen: "boleta" }));
  });
  E.semilla = s.version;
  await guardar();
  return nuevas.length;
}
// Solo existe en el PC (la versión publicada no lleva datos); si no está, se sigue con lo guardado.
async function cargarSemilla() {
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  try {
    const r = await fetch("data/semilla.json", { cache: "no-cache" });
    if (r.ok) await aplicarDatos(await r.json());
  } catch (e) { /* sin red o sin archivo */ }
}
const esArchivoDatos = (x) => x && x.version && Array.isArray(x.compras) && x.ideas && !x.registros;
const esRespaldo = (x) => x && x.registros && Array.isArray(x.compras);

/* ---------- Helpers de datos ---------- */
const metas = () => (E.perfil.metas || { kcal: 2200, proteina: 150, agua_ml: 2500, sueno_h: 7.5, actividad_dias: 4 });
function registro(fecha) {
  if (!E.registros[fecha]) E.registros[fecha] = { peso: null, agua_ml: 0, sueno_h: null, actividad: [], comidas: [] };
  return E.registros[fecha];
}
function todosLosItems() { return E.compras.flatMap((c) => c.items.map((it) => ({ ...it, compra: c }))); }
function disponibles() {
  const set = new Set();
  todosLosItems().forEach((it) => { if (it.alimento && E.stock[it.id] !== "nada") set.add(it.alimento); });
  return set;
}
// Mismas palabras clave que usa el generador de datos para ligar productos con ideas de platos
function alimentoDe(texto) {
  const t = String(texto).toLowerCase();
  const par = (E.claves || []).find(([clave]) => t.includes(clave));
  return par ? par[1] : null;
}
function nombreAlimento(a) {
  const it = todosLosItems().find((i) => i.alimento === a);
  return it ? it.producto : a.replace(/-/g, " ").replace(/^\w/, (c) => c.toUpperCase());
}
function gastoMes(mes) { // mes = "YYYY-MM"
  return E.compras.filter((c) => c.fecha.startsWith(mes)).reduce((a, c) => a + (c.envio || 0) + c.items.reduce((b, i) => b + (i.pagado || 0), 0), 0);
}
function mesesConCompras() {
  const m = new Set(E.compras.map((c) => c.fecha.slice(0, 7))); m.add(hoyISO().slice(0, 7));
  return [...m].sort().reverse();
}
const nombreMes = (m) => MESES[Number(m.slice(5, 7)) - 1] + " " + m.slice(0, 4);

/* ---------- Vista: Hoy ---------- */
const ACTIVIDADES = ["Trekking", "Trote", "Acondicionamiento", "Caminata", "Otra"];
function renderHoy() {
  const f = hoyISO(), r = registro(f), m = metas();
  const prot = r.comidas.reduce((a, c) => a + (Number(c.proteina) || 0), 0);
  const kcal = r.comidas.reduce((a, c) => a + (Number(c.kcal) || 0), 0);
  const actMin = r.actividad.reduce((a, x) => a + (Number(x.min) || 0), 0);
  const sugeridos = Object.values(E.ideas).flat().filter((p) => p.proteina_g >= 12).slice(0, 40);
  $("#v-hoy").innerHTML = `
    ${!E.semilla && !E.compras.length ? `<div class="card">
      <h2>Primera vez</h2>
      <div class="nota">Carga el archivo de datos que te envié (despensa-datos-….json) para ver tu compra, los platos y los precios. Se hace una sola vez; después la app abre sola, incluso sin señal.</div>
      <div class="chips"><label class="btn prim" for="importar-hoy">Cargar archivo de datos</label><input type="file" id="importar-hoy" class="importar" accept="application/json,.json" hidden></div>
    </div>` : ""}
    <div class="card">
      <div class="fila"><span class="label">Proteína</span><span class="num">${prot} / ${m.proteina} g</span></div>
      <div class="barra ${prot > m.proteina * 1.25 ? "alta" : ""}"><span style="width:${Math.min(100, prot / m.proteina * 100)}%"></span></div>
      ${kcal ? `<div class="nota">Calorías anotadas: <span class="num">${kcal}</span> de ${m.kcal} kcal</div>` : ""}
    </div>
    <div class="card">
      <div class="fila"><span class="label">Agua</span><span class="num">${(r.agua_ml / 1000).toLocaleString("es-CL")} / ${(m.agua_ml / 1000).toLocaleString("es-CL")} L</span></div>
      <div class="barra agua"><span style="width:${Math.min(100, r.agua_ml / m.agua_ml * 100)}%"></span></div>
      <div class="chips">
        <button class="btn chico" data-agua="250">+ vaso 250 ml</button>
        <button class="btn chico" data-agua="500">+ botella 500 ml</button>
        <button class="btn chico peligro" data-agua="-250" aria-label="Quitar 250 ml">− 250</button>
      </div>
    </div>
    <div class="card">
      <h2>Comidas de hoy</h2>
      ${r.comidas.length ? `<div class="lista">${r.comidas.map((c, i) => `
        <div class="item"><span class="t">${esc(c.nombre)}</span><span class="s">${c.proteina ? c.proteina + " g proteína" : "sin proteína anotada"}${c.kcal ? " · " + c.kcal + " kcal" : ""}</span>
        <span class="d"><button class="btn chico peligro" data-quitar-comida="${i}" aria-label="Quitar ${esc(c.nombre)}">Quitar</button></span></div>`).join("")}</div>`
        : `<div class="nota">Anota lo que comes para ver si llegas a tu proteína. Desde Cocina, "Comí esto" lo anota solo.</div>`}
      <form class="form" id="f-comida">
        <label style="grid-column:1/-1">Plato
          <input type="text" id="c-nombre" list="dl-platos" placeholder="Ej: pollo con arroz" required autocomplete="off">
          <datalist id="dl-platos">${sugeridos.map((p) => `<option value="${esc(p.plato)}">`).join("")}</datalist>
        </label>
        <label>Proteína (g)<input type="number" id="c-prot" inputmode="numeric" min="0" max="200"></label>
        <label>Calorías (opcional)<input type="number" id="c-kcal" inputmode="numeric" min="0" max="3000"></label>
        <button class="btn prim" type="submit">Anotar</button>
      </form>
    </div>
    <div class="grid2">
      <div class="card">
        <span class="label">Sueño anoche</span>
        <div class="grande">${r.sueno_h ?? "—"} <small>h de ${m.sueno_h}</small></div>
        <form class="form" id="f-sueno"><label>Horas<input type="number" id="s-h" step="0.5" min="0" max="14" inputmode="decimal" value="${r.sueno_h ?? ""}"></label><button class="btn" type="submit">Guardar</button></form>
      </div>
      <div class="card">
        <span class="label">Peso</span>
        <div class="grande">${r.peso ?? ultimoPeso() ?? "—"} <small>kg</small></div>
        <form class="form" id="f-peso"><label>Hoy (kg)<input type="number" id="p-kg" step="0.1" min="40" max="200" inputmode="decimal" value="${r.peso ?? ""}"></label><button class="btn" type="submit">Guardar</button></form>
      </div>
    </div>
    <div class="card">
      <div class="fila"><h2>Actividad</h2><span class="nota">${actMin ? actMin + " min hoy" : ""} · ${diasActivosSemana()} de ${m.actividad_dias} días esta semana</span></div>
      ${r.actividad.length ? `<div class="chips">${r.actividad.map((a, i) => `<button class="chip" data-quitar-act="${i}" aria-label="Quitar ${esc(a.tipo)}">${esc(a.tipo)} ${a.min} min ✕</button>`).join("")}</div>` : ""}

}
function ultimoPeso() {

}

}

  const ultimo = todosLosItems().filter((i) => i.producto === nombre).sort((a, b) => b.compra.fecha.localeCompare(a.compra.fecha))[0];
  return ultimo ? `${clp(ultimo.pagado)} la última vez` : "";
}
function renderCompras() {

/* ---------- Vista: Cocina ---------- */
const TIEMPOS = [[0, "Todos"], [10, "≤ 10 min"], [20, "≤ 20 min"], [30, "≤ 30 min"]];
function semanaActual() { return lunesDe(hoyISO()); }
function renderCocina() {
  const disp = disponibles(), q = ui.texto.trim().toLowerCase();

      </tbody></table></div>

      <input type="search" id="buscar" placeholder="Buscar plato o ingrediente" value="${esc(ui.texto)}" aria-label="Buscar plato">
      <div class="chips">${TIEMPOS.map(([t, x]) => `<button class="chip" data-tiempo="${t}" aria-pressed="${ui.tiempo === t}">${x}</button>`).join("")}
        <button class="chip" id="solo-disp" aria-pressed="${ui.soloDisponibles}">Solo con lo que tengo</button></div>
      <div class="nota">${platos.length} platos${ui.soloDisponibles ? " con lo que hay en la despensa" : ""}. Proteína por porción aproximada.</div>
    </div>
    <div class="lista">
      ${platos.map((p) => `
        <article class="card plato">
          <div class="fila"><h3>${esc(p.plato)}</h3><span class="tiempo num ${p.tiempo_min > 20 ? "lento" : ""}">${p.tiempo_min} min</span></div>
          ${p.pasos ? `<div>${esc(p.pasos)}</div>` : ""}
          <div class="meta-mini">${p.proteina_g ? `<span><b class="num">≈${p.proteina_g} g</b> proteína</span>` : ""}${p.conservacion ? `<span>${esc(p.conservacion)}</span>` : ""}<span>con ${esc(nombreAlimento(p.alimento))}</span></div>
          ${p.faltan.length ? `<div class="aviso">Te falta: ${p.faltan.map(esc).join(", ")} <button class="btn chico" data-faltan="${esc(p.faltan.join("|"))}">A la lista</button></div>` : ""}
          <div class="fila">
            <select data-asignar="${esc(p.plato)}" aria-label="Agregar ${esc(p.plato)} al menú" style="width:auto;flex:1">
              <option value="">Agregar al menú…</option>
              ${DIAS.flatMap((d) => ["almuerzo", "cena"].map((c) => `<option value="${d}|${c}">${d} ${c}</option>`)).join("")}
            </select>
            <button class="btn chico" data-comi="${esc(p.plato)}" data-prot="${p.proteina_g || 0}">Comí esto</button>

        </article>`).join("") || `<div class="vacio">Ningún plato coincide. Quita filtros o marca más productos como "Hay".</div>`}
    </div>`;
}

/* ---------- Vista: Progreso ---------- */
let graficos = [];
function ultimosDias(n) { const out = []; const d = new Date(); for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i); out.push(x.toLocaleDateString("sv-SE")); } return out; }
function renderProgreso() {
  graficos.forEach((g) => g.destroy()); graficos = [];
  const m = metas(), dias = ultimosDias(14);
  const prot = dias.map((f) => (E.registros[f]?.comidas || []).reduce((a, c) => a + (Number(c.proteina) || 0), 0));
  const agua = dias.map((f) => (E.registros[f]?.agua_ml || 0) / 1000);
  const sueno = dias.map((f) => E.registros[f]?.sueno_h ?? null);
  const pesos = Object.keys(E.registros).filter((f) => E.registros[f].peso).sort().map((f) => ({ f, kg: E.registros[f].peso }));
  const conDatos = dias.filter((f, i) => prot[i] > 0);
  const promProt = conDatos.length ? Math.round(conDatos.reduce((a, f) => a + prot[dias.indexOf(f)], 0) / conDatos.length) : 0;
  $("#v-progreso").innerHTML = `
    <div class="grid2">
      <div class="card"><span class="label">Peso actual</span><div class="grande">${ultimoPeso() ?? "—"} <small>kg</small></div><div class="nota">Inicio: ${E.perfil.peso_inicial ?? "—"} kg</div></div>
      <div class="card"><span class="label">Proteína promedio</span><div class="grande">${promProt || "—"} <small>g/día</small></div><div class="nota">Meta ${m.proteina} g · días anotados</div></div>
    </div>
    <div class="card"><h2>Peso</h2>${pesos.length > 1 ? `<div class="lienzo"><canvas id="g-peso" role="img" aria-label="Gráfico de peso"></canvas></div>` : `<div class="nota">Anota tu peso una vez por semana (en ayunas) y aquí verás la tendencia.</div>`}</div>
    <div class="card"><h2>Proteína, últimos 14 días</h2><div class="lienzo"><canvas id="g-prot" role="img" aria-label="Gráfico de proteína diaria"></canvas></div></div>
    <div class="card"><h2>Agua y sueño</h2><div class="lienzo"><canvas id="g-agua" role="img" aria-label="Gráfico de agua y sueño"></canvas></div></div>
    <div class="card">
      <h2>Datos y respaldo</h2>
      <div class="nota">Tus datos viven solo en este teléfono. Descarga un respaldo cada semana y envíamelo cuando quieras que analice tu mes.</div>
      <div class="nota">"Cargar archivo" sirve para dos cosas: el archivo de datos que te envío con cada boleta (suma compras sin borrar nada) o un respaldo tuyo (reemplaza todo).</div>
      <div class="chips"><button class="btn" id="exportar">Descargar respaldo</button><label class="btn" for="importar">Cargar archivo</label><input type="file" id="importar" class="importar" accept="application/json,.json" hidden></div>
    </div>`;
  if (typeof Chart === "undefined") return;
  const css = getComputedStyle(document.documentElement);
  const c = (v) => css.getPropertyValue(v).trim();
  Chart.defaults.color = c("--muted"); Chart.defaults.borderColor = c("--line"); Chart.defaults.font.family = "Inter, system-ui, sans-serif";
  const etiquetas = dias.map((f) => f.slice(8) + "/" + f.slice(5, 7));
  const base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, labels: { boxWidth: 12 } } }, scales: { x: { grid: { display: false } } } };
  graficos.push(new Chart($("#g-prot"), { type: "bar", data: { labels: etiquetas, datasets: [
    { label: "Proteína (g)", data: prot, backgroundColor: c("--accent"), borderRadius: 4 },
    { label: "Meta", data: dias.map(() => m.proteina), type: "line", borderColor: c("--chili"), borderDash: [6, 4], pointRadius: 0, borderWidth: 2 },
  ] }, options: base }));
  graficos.push(new Chart($("#g-agua"), { type: "line", data: { labels: etiquetas, datasets: [
    { label: "Agua (L)", data: agua, borderColor: c("--water"), backgroundColor: c("--water-soft"), fill: true, tension: .3, yAxisID: "y" },
    { label: "Sueño (h)", data: sueno, borderColor: c("--accent"), spanGaps: true, tension: .3, yAxisID: "y2" },
  ] }, options: { ...base, scales: { x: { grid: { display: false } }, y: { position: "left", beginAtZero: true }, y2: { position: "right", beginAtZero: true, grid: { display: false } } } } }));
  if (pesos.length > 1) graficos.push(new Chart($("#g-peso"), { type: "line", data: { labels: pesos.map((p) => p.f.slice(8) + "/" + p.f.slice(5, 7)), datasets: [
    { label: "Peso (kg)", data: pesos.map((p) => p.kg), borderColor: c("--accent"), backgroundColor: c("--accent-soft"), fill: true, tension: .25, pointRadius: 3 },
  ] }, options: base }));
}

/* ---------- Navegación y eventos ---------- */
const VISTAS = { hoy: ["Hoy", renderHoy], despensa: ["Despensa", renderDespensa], compras: ["Compras", renderCompras], cocina: ["Cocina", renderCocina], progreso: ["Progreso", renderProgreso] };
let vista = "hoy";
function mostrar(v) {
  if (!VISTAS[v]) v = "hoy"; vista = v;
  Object.keys(VISTAS).forEach((k) => { $("#v-" + k).hidden = k !== v; });
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.vista === v));
  $("#titulo").textContent = VISTAS[v][0];
  $("#subtitulo").textContent = v === "hoy" ? fmtFecha(hoyISO()) : [E.perfil.nombre, E.perfil.comuna].filter(Boolean).join(" · ");
  VISTAS[v][1]();
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
}
const refrescar = () => { guardar(); VISTAS[vista][1](); };

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const r = registro(hoyISO()), d = b.dataset;
  if (d.vista) { mostrar(d.vista); window.scrollTo(0, 0); return; }
  if (d.agua) { r.agua_ml = Math.max(0, r.agua_ml + Number(d.agua)); refrescar(); return; }
  if (d.quitarComida !== undefined) { r.comidas.splice(Number(d.quitarComida), 1); refrescar(); return; }
  if (d.quitarAct !== undefined) { r.actividad.splice(Number(d.quitarAct), 1); refrescar(); return; }
  if (d.stock) {
    E.stock[d.stock] = d.valor;
    const it = todosLosItems().find((i) => i.id === d.stock);
    if (it && d.valor !== "hay") { agregarALista(textoProducto(it), it.alimento, "despensa"); toast(`${textoProducto(it)} agregado a Compras`); }
    refrescar(); return;
  }
  if (d.rapida) {
    const [producto, categoria, cantidad, unidad, pagado, alimento] = d.rapida.split("|");
    $("#m-prod").value = producto; $("#m-cant").value = cantidad; $("#m-uni").value = unidad; $("#m-precio").value = pagado;
    $("#m-prod").dataset.alimento = alimento; $("#m-prod").dataset.categoria = categoria; $("#m-precio").focus(); return;
  }
  if (d.borrarLista) { E.lista = E.lista.filter((l) => l.id !== d.borrarLista); refrescar(); return; }
  if (b.id === "limpiar-lista") { E.lista = E.lista.filter((l) => !l.hecho); refrescar(); return; }
  if (b.id === "copiar-lista") {
    const txt = E.lista.filter((l) => !l.hecho).map((l) => "- " + l.nombre).join("\n");
    navigator.clipboard?.writeText(txt).then(() => toast("Lista copiada"), () => toast("No se pudo copiar"));
    return;
  }
  if (d.tiempo !== undefined) { ui.tiempo = Number(d.tiempo); renderCocina(); return; }
  if (b.id === "solo-disp") { ui.soloDisponibles = !ui.soloDisponibles; renderCocina(); return; }
  if (d.quitarMenu) { const [dia, c] = d.quitarMenu.split("|"); delete E.menu[semanaActual()][dia][c]; refrescar(); return; }
  if (d.faltan) { d.faltan.split("|").forEach((n) => agregarALista(n, alimentoDe(n), "cocina")); guardar(); toast("Agregado a Compras"); return; }
  if (d.comi) { r.comidas.push({ nombre: d.comi, proteina: Number(d.prot) || null, kcal: null }); guardar(); toast("Anotado en Hoy"); return; }
  if (b.id === "exportar") {
    const blob = new Blob([JSON.stringify(E, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `despensa-respaldo-${hoyISO()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); return;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.lista) { const l = E.lista.find((x) => x.id === t.dataset.lista); if (l) l.hecho = t.checked; refrescar(); return; }
  if (t.id === "sel-mes") { ui.mes = t.value; renderDespensa(); return; }
  if (t.dataset.asignar && t.value) {
    const [dia, c] = t.value.split("|"), sem = semanaActual();
    E.menu[sem] = E.menu[sem] || {}; E.menu[sem][dia] = E.menu[sem][dia] || {}; E.menu[sem][dia][c] = t.dataset.asignar;
    toast(`${dia} ${c}: listo`); refrescar(); return;
  }
  if (t.classList.contains("importar") && t.files[0]) {
    t.files[0].text().then(async (txt) => {
      const x = JSON.parse(txt);
      if (esArchivoDatos(x)) {
        const n = await aplicarDatos(x);
        mostrar(vista);
        toast(n === null ? "Ese archivo ya estaba cargado" : n ? `Listo: ${n} compra${n > 1 ? "s" : ""} nueva${n > 1 ? "s" : ""}` : "Datos actualizados");
      } else if (esRespaldo(x)) {
        if (!confirm("El respaldo reemplaza todo lo que hay ahora en la app. ¿Seguir?")) return;
        E = x; await guardar(); mostrar(vista); toast("Respaldo cargado");
      } else throw new Error("formato");
    }).catch(() => toast("Ese archivo no es de Despensa")).finally(() => { t.value = ""; });
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "buscar") { ui.texto = e.target.value; const pos = e.target.selectionStart; renderCocina(); const s = $("#buscar"); s.focus(); s.setSelectionRange(pos, pos); } });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target, r = registro(hoyISO());
  if (f.id === "f-comida") { r.comidas.push({ nombre: $("#c-nombre").value.trim(), proteina: Number($("#c-prot").value) || null, kcal: Number($("#c-kcal").value) || null }); }
  if (f.id === "f-sueno") { r.sueno_h = Number($("#s-h").value) || null; }
  if (f.id === "f-peso") { r.peso = Number($("#p-kg").value) || null; }
  if (f.id === "f-act") { r.actividad.push({ tipo: $("#a-tipo").value, min: Number($("#a-min").value) }); }
  if (f.id === "f-lista") { agregarALista($("#l-nombre").value.trim(), null, "manual"); }
  if (f.id === "f-compra") {
    const p = $("#m-prod"), fecha = $("#m-fecha").value || hoyISO(), tienda = $("#m-tienda").value.trim() || "Carnicería";
    const cid = "manual-" + tienda.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + fecha;
    let c = E.compras.find((x) => x.id === cid);
    if (!c) { c = { id: cid, tienda, fecha, envio: 0, items: [] }; E.compras.push(c); }
    const it = { id: cid + "-" + uid(), producto: p.value.trim(), categoria: p.dataset.categoria || "Proteinas", cantidad: Number($("#m-cant").value) || 1,
      unidad: $("#m-uni").value, pagado: Number($("#m-precio").value) || 0, alimento: p.dataset.alimento || null };
    c.items.push(it); E.stock[it.id] = "hay"; delete p.dataset.alimento; delete p.dataset.categoria;
    toast("Compra agregada");
  }
  refrescar();
});

function estadoRed() { $("#estado-red").textContent = navigator.onLine ? "" : "Sin señal · todo se guarda en el teléfono"; }
addEventListener("online", () => { estadoRed(); cargarSemilla().then(() => VISTAS[vista][1]()); });
addEventListener("offline", estadoRed);
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v !== vista && VISTAS[v]) mostrar(v); });

(async function iniciar() {
  E = (await DB.leer()) || estadoVacio();
  await cargarSemilla();
  estadoRed();
  mostrar((location.hash || "#hoy").slice(1));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
